name: Test

# `build.zig` is the build; there is no `make`, `build_win` or `meson`.
#
# **This file cannot be verified from a development machine.** Everything below
# was checked as a command -- locally on macOS and in podman on Linux -- but a
# workflow is verified by its first run. Read the first run rather than
# assuming this one is right.

on: [push, pull_request]

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

# Every job carries a `timeout-minutes`. The default is 360, and a suite that
# deadlocks rather than failing holds the runner for all of it: a fiber parked
# on a channel with no living writer keeps the event loop's listener count
# non-zero, so the loop waits rather than reporting that nothing can progress.
#
# Every entry builds and tests in under five minutes from a cold `setup-zig`
# cache, and the allowance is about twice that, so a job that overruns is
# wedged rather than merely slow.
#
# Size these against a cold cache rather than a typical run: it is the slow
# case, and it is the one a first run after a cache miss has to survive. A
# warm cache is not reliably faster either -- between the first two runs
# `macos-latest` fell from 3m39s to 1m11s while `glibc` rose from 3m51s to
# 5m22s.

jobs:

  # The whole graph: `zig build test` outright, as the `glibc` job runs it.
  #
  # arm64 only. The `macos-15-intel` entry was dropped: Apple no longer
  # supports the platform, and the entry was three times slower than any other
  # in the matrix. x86-64 still executes on the two native Linux jobs, and
  # `res/testing/matrix.janet` keeps an `x86_64-macos` build-only entry, so the
  # Darwin arms are still compiled at that width. What no longer runs anywhere
  # is x86-64 *on Darwin*, which that entry declines to run in any case because
  # it needs Rosetta.
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
      # The published build surface, exercised from outside the package.
      # `examples/numarray` is compiled by this repository's own `build()` with
      # the private module graph in hand, so it proves the source experience
      # and cannot notice if `wattleModule` rots. `examples/standalone` depends
      # on this package by path and reaches it only through that helper.
      - name: Standalone consumer
        run: zig build examples/standalone

  # Linux against **musl**. It is static (`-Dlinkage=static`) because the
  # runner image has no musl loader, so it runs natively with no container.
  # A static musl executable cannot load a native module at all -- musl's
  # static `dlopen` is a stub that always fails -- so `zig build test` is not
  # run here and its three parts are run by hand instead: the contracts, the
  # in-file runtime tests, and the suites. `-Dinstall-tests=true` is what puts
  # the runtime-test binary under `<prefix>/test` beside the contract driver;
  # a plain build installs only the contract and fuzz drivers. The `glibc` job
  # below runs the native-module half. The two libcs are not interchangeable:
  # glibc's allocator checks what musl's does not, so both are run
  # (`test/README.md`).
  linux:
    name: Linux ${{ matrix.arch }} (musl)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,     arch: x86_64,  target: x86_64-linux-musl }
          - { os: ubuntu-24.04-arm,  arch: aarch64, target: aarch64-linux-musl }
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build
        run: >
          zig build -Dtarget=${{ matrix.target }} -Dcpu=baseline
          -Dlinkage=static -Dinstall-tests=true
      - name: Contracts
        run: |
          set -eu
          fail=0
          # The driver takes one contract name; run every one by name rather
          # than the driver in bulk. A driver that aborts reports one failure
          # per run, and a first failure is not a failure count.
          for f in test/*.zig; do
            name=$(basename "$f" .zig)
            if ./zig-out/test/wattle-contract-test "$name" >/dev/null 2>&1; then
              continue
            fi
            # Not every test/*.zig is a contract; the driver rejects a name it
            # does not know, which is indistinguishable from a failure here.
            # `test/contracts.zig` is the list, so ask it.
            if grep -q "\"$name\"" test/contracts.zig; then
              echo "CONTRACT FAILED: $name"
              ./zig-out/test/wattle-contract-test "$name" 2>&1 | tail -20
              fail=1
            fi
          done
          exit $fail
      # The 49 in-file runtime tests, which `zig build test` would run and
      # which the contract driver does not cover. Run bare rather than through
      # the build runner: bare, the default test runner prints its count, and
      # a set that has silently become empty is then visible as one.
      - name: Runtime tests
        run: ./zig-out/test/wattle-runtime-test
      - name: Suites
        run: |
          set -eu
          # Source is `.wattle`; `.janet` is not loaded. An unmatched glob is
          # left literal by the shell and would reach the runtime as a missing
          # file, which reads as a failing suite rather than as no suites, so
          # say which it is.
          set -- test/suite-*.wattle
          if [ ! -e "$1" ]; then echo "NO SUITES MATCHED: test/suite-*.wattle"; exit 1; fi
          fail=0
          for s in "$@"; do
            if ! ./zig-out/bin/wattle "$s"; then echo "SUITE FAILED: $s"; fail=1; fi
          done
          exit $fail

  # glibc is the runner's own libc, so this build is native and dynamically
  # linked and runs `zig build test` outright, as the macOS job does. That
  # covers what the static musl jobs cannot: module loading, the examples and
  # the runtime unit tests. glibc's allocator also checks what musl's does not.
  glibc:
    name: Linux x86_64 (glibc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
      - name: Standalone consumer
        run: zig build examples/standalone

  # Debug does not fold identical functions and does not elide safety checks,
  # and defects have been found that only a release mode exposed, so these are
  # not a formality.
  optimize:
    name: ${{ matrix.mode }}
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [ ReleaseSafe, ReleaseFast, ReleaseSmall ]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Test
        run: zig build test -Doptimize=${{ matrix.mode }}

  # **Windows, executed.** Nothing had ever run a Windows binary, here or
  # anywhere: the `cross` matrix below compiles the Windows arms and no run of
  # one has followed. These two entries are the first, so they are
  # `continue-on-error` until a run proves them -- a failure here reports what
  # is broken without asserting that the supported matrix is. Promote them by
  # removing the flag, and say so in README.md's platform table, once they
  # pass. The allowance is a guess: no Windows job has been measured.
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x86-64 }
          - { os: windows-11-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # `zig build` on the arm64 entry exited 1 in half a second having
      # printed nothing, with the cache left at 103 bytes, so nothing had
      # compiled and nothing said why. These report what the build sees before
      # it runs; drop them once the cause is known.
      - name: Zig environment
        run: |
          zig version
          zig env
      - name: Build
        run: zig build --summary all
      - name: Test
        run: zig build test --summary all

  # riscv32 under QEMU user-mode, which `-fqemu` invokes per artifact. The
  # 32-bit entries in `cross` compile the 32-bit arms and nothing runs them;
  # `wasm32-wasi` is the only 32-bit target that executes, and it has no event
  # loop, so this is the only thing that would run the 32-bit layout with one.
  #
  # `test/README.md` rules out emulation for x86-64 because the NaN-boxed
  # layout packs pointers into the low 47 bits and QEMU does not honour that.
  # The 32-bit layout has no such assumption, so the objection may not carry
  # over -- which is what this entry is for. `continue-on-error` until it
  # proves out.
  qemu:
    name: riscv32 (qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
      # Static for the same reason the musl jobs are: QEMU reported
      # `Could not open '/lib/ld-musl-riscv32.so.1'`, and there is no musl
      # loader for this width on the runner for it to find.
      - name: Test
        run: >
          zig build test -Dtarget=riscv32-linux-musl -Dcpu=baseline
          -Dlinkage=static -fqemu

  # Build-only, and they are not a formality: Zig analyses only the comptime
  # branches it selects, so a 32-bit target is the only thing anywhere that
  # type-checks the `JANET_NANBOX_32` and 32-bit paths, and the Windows entry
  # is the only thing that sees the Windows arms at all. `test/README.md` has
  # the reasoning.
  #
  # There are three 32-bit entries rather than one as of Part 25. `x86` and
  # `arm` were recorded as impossible -- musl's 32-bit `time64` `__REDIR`
  # declarations were blamed -- and the real cause was this tree shadowing
  # musl's `features.h` with its own. Renaming ours opened both.
  cross:
    name: cross ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - riscv32-linux-musl
          - x86-linux-musl
          - arm-linux-musleabihf
          - x86_64-windows-gnu
          - aarch64-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Dcpu=baseline

  # wasm32-wasi runs rather than only building. The suites and the contracts
  # execute under wasmtime, which `-fwasmtime` invokes for each artifact and
  # which preopens the working directory and nothing else. Both optimize modes
  # are run: ReleaseSmall is where the printer's native recursion came closest
  # to the host's call stack, which is what the target's lower recursion guard
  # is for.
  #
  # The `standalone` step the macOS job runs builds a native module, and a
  # WASI build loads none, so it is not part of this one.
  wasi:
    name: wasm32-wasi (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [ Debug, ReleaseSmall ]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Test
        run: zig build test -Dtarget=wasm32-wasi -fwasmtime -Doptimize=${{ matrix.mode }}
      # `examples/web`, the reactor a page drives, run under the runner's Node
      # with the page's own `wasi.js`. `test.js` needs Node 22.7 or later,
      # which runs a `.js` file written as an ES module without a
      # `package.json`; the Ubuntu 24.04 image ships 22.23.
      - name: Test examples/web
        run: |
          zig build examples/web -Doptimize=${{ matrix.mode }}
          node --version
          node examples/web/test.js
